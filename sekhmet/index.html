<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Sekhmet — the Powerful One. Prototype links: research dossier and related site." />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Sekhmet · prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0a;
      --fg: #e8e6e3;
      --muted: #8a8680;
      --line: #2a2826;
      --accent: #c45c26;
    }
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 14px;
      line-height: 1.6;
      color: var(--fg);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    main { width: 100%; max-width: 28rem; }
    h1 {
      margin: 0;
      font-size: 1.125rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    p { margin: 0.75rem 0 0; color: var(--muted); font-weight: 400; }
    nav {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      border-top: 1px solid var(--line);
      padding-top: 1.25rem;
    }
    a {
      color: var(--fg);
      text-decoration: none;
      border-bottom: 1px solid var(--line);
      padding: 0.55rem 0;
      transition: color 0.15s, border-color 0.15s;
    }
    a:hover { color: var(--accent); border-color: var(--accent); }
    a:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }
    .meta {
      margin-top: 2rem;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <main>
    <h1>Sekhmet</h1>
    <p>sḫmt — the Powerful One. Prototype.</p>
    <nav aria-label="Links">
      <a href="https://github.com/VeigaPunk/plazir-15-site/releases/download/sekhmet-research/Sekhmet_Deep_Research.pdf">Research dossier (PDF)</a>
      <a href="../">Plazir-15 · alternate site</a>
    </nav>
    <p class="meta">Power made present · danger brought into order</p>
  </main>
</body>
</html>
